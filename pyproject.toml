[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-blackbox"
version = "0.1.0"
description = "Windows-native flight recorder and firewall for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "AgentBlackbox Contributors"}
]
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "cryptography>=41.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
    "websockets>=11.0",
]

[tool.setuptools.packages.find]
include = ["agent_blackbox*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"

[project.scripts]
agent-blackbox = "agent_blackbox.cli:main"
blackbox = "agent_blackbox.cli:main"
abb = "agent_blackbox.cli:main"
